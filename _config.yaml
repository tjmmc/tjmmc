title: TJ Math Modeling Club
description: The math modeling club at Thomas Jefferson High School for Science and Technology. 2023 M3 Challenge champions.
url: "https://tjmmc.org"
permalink: pretty
plugins:
  - jekyll-sitemap
exclude:
  - materials          # print-material source (packet, flier); see materials/README.md
  - OLD-website
  - README.md
  - LICENSE
  - static/setup.md
defaults:
  # The flier is shared by link (tjmmc.org/u/flier), not listed on the site or in the sitemap.
  - scope:
      path: "static/media/TJM2-2026-Flier.pdf"
    values:
      sitemap: false
  # HiMCM tryout packet: shared by link (tjmmc.org/u/himcm26).
  - scope:
      path: "static/media/HiMCM-2026-Tryouts.pdf"
    values:
      sitemap: false
