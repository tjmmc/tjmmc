# FAQ on the TJM² page, in display order. Answers can use HTML.
- q: Who can compete?
  a: "Middle and high school students (grades 6&ndash;12) from any school. Middle and high schoolers compete in separate divisions."
- q: How big are teams?
  a: "Three to five students, all middle school or all high school. Coming alone? Sign up anyway and we&rsquo;ll match you with a team."
- q: Do I need experience?
  a: "No. We teach modeling basics that morning, and you can ask questions on our Discord anytime before the event."
- q: What does it cost?
  a: "Nothing. Entry is free, and lunch, dinner and snacks are on us."
- q: What&rsquo;s the schedule?
  a: "Tentatively 8 a.m. to 7 p.m. Check-in is at 8, the problem drops at 9, papers are due at 3, finalists present that evening, and awards start around 6:30. We&rsquo;ll email exact times to everyone who signs up."
- q: How is it judged?
  a: "Judges read every paper and score the model, the assumptions behind it, and how well you justify your decisions. The top teams in each division present to the judges that evening."
- q: Can we use AI?
  a: "Yes, to find models and write code. Judges weigh how well you can justify every decision, so make sure you understand your own model."
- q: What should we bring?
  a: "At least one laptop per team (tell us if you need one), plus chargers. We&rsquo;ll send a parent consent form before the event."
- q: Where is it?
  a: "Thomas Jefferson High School for Science and Technology, 6560 Braddock Road, Alexandria, VA 22312."
