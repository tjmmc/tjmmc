<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <meta name="description" content="TJHSST Math Modeling Club">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css?v={{ site.time | date: '%s' }}">
    <script src="/static/js/main.js?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body>
    <nav class="Nav">
        <div class="Logo">
            <a href="/"><img src="/static/images/TJMMC-Logo-Black.png" alt="TJ Math Modeling Club"></a>
        </div>
        <button class="navbar-toggle" id="js-navbar-toggle" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <div class="Navlinks" id="js-navlinks">
            <a href="/tjm2/" {% if page.nav == "tjm2" %}class="active"{% endif %}>tjm&sup2;</a>
            <a href="/activities/" {% if page.nav == "activities" %}class="active"{% endif %}>activities</a>
            <a href="/lectures/" {% if page.nav == "lectures" %}class="active"{% endif %}>lectures</a>
            <a href="/potm/" {% if page.nav == "potm" %}class="active"{% endif %}>potm</a>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer class="Footer">
        <div class="Footer-left">
            <p>&copy; 2026 TJ Math Modeling Club</p>
            <p class="Footer-heart">made w &lt;3 by mmc</p>
        </div>
        <div class="Footer-right">
            {% for item in site.data.footer %}
            <a href="{{ item.link }}">{{ item.name }}</a>
            {% endfor %}
        </div>
    </footer>
</body>
</html>
